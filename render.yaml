# Render Blueprint — أنشئ Web Service من المستودع واضبط المتغيرات في لوحة Render
# https://render.com/docs/blueprint-spec
# Python 3.14+ قد يبني pydantic-core من المصدر (Rust) ويفشل على Render — استخدم 3.11.x
services:
  - type: web
    name: alharis-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
