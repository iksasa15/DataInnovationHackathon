# Render Blueprint — أنشئ Web Service من المستودع واضبط المتغيرات في لوحة Render
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: alharis-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
