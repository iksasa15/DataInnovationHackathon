# يبني واجهة DataHackathon وينشرها إلى GitHub Pages (تطبيق Vue وليس README).
# بعد الدمج: الإعدادات → Pages → Build and deployment → Source: GitHub Actions.
# أضف في Repository secrets: VITE_API_URL = رابط الـ API العام (مثل https://xxx.onrender.com)
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DataHackathon/package-lock.json

      - name: Install and build
        working-directory: DataHackathon
        env:
          # مسار مشروع GitHub Pages: https://USER.github.io/REPO/
          VITE_BASE_PATH: /DataInnovationHackathon/
          # Hash router + 404.html يعيد توجيه /REPO/analysis → /REPO/#/analysis (إصلاح 404 على Pages)
          VITE_GH_PAGES: 'true'
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          # build-only يتخطى vue-tsc — npm run build يفشل أحياناً ويمنع النشر فيبقى README كصفحة افتراضية
          npm run build-only

      - name: Disable Jekyll on Pages
        run: touch DataHackathon/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: DataHackathon/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
