# يبني DataHackathon ويدفع dist إلى مجلد docs/ على main.
# في GitHub: Settings → Pages → Source: Deploy from branch → Branch: main → Folder: /docs
# (ليس الجذر / ولا README — ولا يلزم «GitHub Actions» كمصدر للصفحات.)
# عنوان الـ API الافتراضي: DataHackathon/.env.production (VITE_API_URL).
# اختياري: Secret باسم VITE_API_URL يتجاوزه إن وُجد (انظر خطوة البناء).
name: Deploy frontend to GitHub Pages (docs)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DataHackathon/package-lock.json

      - name: Install and build
        working-directory: DataHackathon
        env:
          VITE_BASE_PATH: /DataInnovationHackathon/
          VITE_GH_PAGES: 'true'
        run: |
          npm ci
          # إن وُجد Secret يتجاوز .env.production (لا تمرّر متغيراً فارغاً فيلغي الملف)
          if [ -n "${{ secrets.VITE_API_URL }}" ]; then export VITE_API_URL="${{ secrets.VITE_API_URL }}"; fi
          npm run build-only

      - name: Disable Jekyll
        run: touch DataHackathon/dist/.nojekyll

      - name: Push dist to docs/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: DataHackathon/dist
          target-folder: docs
          clean-target-folder: true
          commit-message: 'chore(pages): deploy Vue app to docs [skip ci]'
